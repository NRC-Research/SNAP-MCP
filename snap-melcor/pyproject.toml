[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snap-melcor-mcp"
version = "0.1.0"
description = "MCP server for MELCOR2X input deck manipulation via SNAP Python API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["snap_melcor"]

[project.scripts]
snap-melcor-mcp = "mcp_server:main"
